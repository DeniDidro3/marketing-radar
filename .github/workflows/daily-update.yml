name: Daily Marketing Radar Update

on:
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Build encrypted report
        run: python -u update_data.py
        env:
          PYTHONUNBUFFERED: "1"
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}

      - name: Commit refreshed encrypted data
        run: |
          git config user.name "marketing-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/report.enc

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: daily encrypted marketing data update"
            git push
          fi
